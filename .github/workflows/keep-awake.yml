# Render's free plan puts the server to sleep after about 15 minutes with no traffic,
# and the first request after that takes about 40 seconds. This ping keeps it awake.
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 120 --retry 2 https://pamo-ttyk.onrender.com/api/health
