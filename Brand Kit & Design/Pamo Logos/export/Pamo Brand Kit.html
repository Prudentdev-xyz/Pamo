document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ze:32px; line-height:40px\">Colour<\u002Fh2>\n    <p style=\"margin:0; font-size:16px; line-height:24px; color:#5A655E; max-width:640px\">White comes first. It is the colour you see most; green is the colour you remember. Shown at their real share of a screen.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex; height:260px; border:1px solid #DCE2DD; border-radius:16px; overflow:hidden\">\n    <div style=\"flex:65; padding:24px; display:flex; flex-direction:column; justify-content:flex-end; gap:4px\"><div style=\"font-size:20px; font-weight:700\">White<\u002Fdiv><div style=\"font-size:14px; color:#5A655E\">#FFFFFF · 60–70% · backgrounds<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:25; background:#0A0A0A; color:#FFFFFF; padding:24px; display:flex; flex-direction:column; justify-content:flex-end; gap:4px\"><div style=\"font-size:20px; font-weight:700\">Black<\u002Fdiv><div style=\"font-size:14px; color:#A3ADA6\">#0A0A0A · 20–30% · text, logo<\u002Fdiv><\u002Fdiv>\n    <div style=\"flex:10; min-width:110px; background:#0B7A4B; color:#FFFFFF; padding:24px 16px; display:flex; flex-direction:column; justify-content:flex-end; gap:4px\"><div style=\"font-size:20px; font-weight:700\">Green<\u002Fdiv><div style=\"font-size:14px\">#0B7A4B · ~10%<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid; gap:16px\">\n    <h3 style=\"margin:0; font-size:20px; line-height:28px\">Helpers<\u002Fh3>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px\">\n      <sc-for list=\"{{ helpers }}\" as=\"c\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid; gap:10px\">\n          <div style=\"height:80px; border-radius:12px; border:1px solid #DCE2DD; background:{{ c.hex }}\"><\u002Fdiv>\n          <div style=\"display:grid; gap:2px\"><span style=\"font-size:14px; font-weight:600\">{{ c.name }}<\u002Fspan><span style=\"font-size:13px; color:#5A655E\">{{ c.hex }}<\u002Fspan><span style=\"font-size:13px; line-height:18px; color:#5A655E\">{{ c.job }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid; gap:16px\">\n    <h3 style=\"margin:0; font-size:20px; line-height:28px\">Status<\u002Fh3>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:16px\">\n      <div style=\"background:#FCEBE9; border-radius:12px; padding:20px; display:grid; gap:6px\"><b style=\"font-size:14px; color:#B3261E\">Error<\u002Fb><span style=\"font-size:14px; color:#B3261E\">The saving failed. Nothing was moved.<\u002Fspan><span style=\"font-size:13px; margin-top:8px\">#B3261E on #FCEBE9<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#FFF4DC; border-radius:12px; padding:20px; display:grid; gap:6px\"><b style=\"font-size:14px; color:#8A5A00\">Caution<\u002Fb><span style=\"font-size:14px; color:#8A5A00\">This vault is low on available cash.<\u002Fspan><span style=\"font-size:13px; margin-top:8px\">#8A5A00 on #FFF4DC<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#E6F4EC; border-radius:12px; padding:20px; display:grid; gap:6px\"><b style=\"font-size:14px; color:#0B7A4B\">Success<\u002Fb><span style=\"font-size:14px; color:#0B7A4B\">Saved. 500.00 USDC is in Rent.<\u002Fspan><span style=\"font-size:13px; margin-top:8px\">Pamo green on mint, no extra colour<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"border-top:1px solid #DCE2DD; padding:64px 0; display:grid; gap:32px\">\n  <div style=\"display:grid; gap:8px\">\n    <div style=\"font-size:14px; font-weight:600; color:#5A655E\">03<\u002Fdiv>\n    <h2 style=\"margin:0; font-size:32px; line-height:40px\">Colour in use<\u002Fh2>\n    <p style=\"margin:0; font-size:16px; line-height:24px; color:#5A655E; max-width:640px\">Text needs 4.5 or more against what is behind it. Pairs we use, and the ones we never do.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px\">\n    <sc-for list=\"{{ pairs }}\" as=\"p\" hint-placeholder-count=\"12\">\n      <div style=\"border:1px solid #DCE2DD; border-radius:12px; overflow:hidden\">\n        <div style=\"background:{{ p.bg }}; color:{{ p.fg }}; height:88px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; font-variant-numeric:tabular-nums\">{{ p.sample }}<\u002Fdiv>\n        <div style=\"padding:12px 14px; display:grid; gap:2px; font-size:13px; border-top:1px solid #DCE2DD\">\n          <div style=\"display:flex; justify-content:space-between; gap:8px\"><span>{{ p.label }}<\u002Fspan><span style=\"font-weight:600; color:{{ p.rc }}\">{{ p.ratio }}<\u002Fspan><\u002Fdiv>\n          <span style=\"color:#5A655E\">{{ p.note }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); gap:24px; font-size:14px; line-height:20px\">\n    <div style=\"display:grid; gap:4px\"><b>One green button per screen<\u002Fb><span style=\"color:#5A655E\">The main action. Others are black outline or plain text.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid; gap:4px\"><b>Green means act or gain<\u002Fb><span style=\"color:#5A655E\">Buttons, links, progress, earned amounts. Never headings.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid; gap:4px\"><b>Black is a moment<\u002Fb><span style=\"color:#5A655E\">A dark footer or one landing section. No dark mode.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid; gap:4px\"><b>Never colour alone<\u002Fb><span style=\"color:#5A655E\">Every state has a word or icon: Earned, Locked, Failed.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"border-top:1px solid #DCE2DD; padding:64px 0; display:grid; gap:40px\">\n  <div style=\"display:grid; gap:8px\">\n    <div style=\"font-size:14px; font-weight:600; color:#5A655E\">04<\u002Fdiv>\n    <h2 style=\"margin:0; font-size:32px; line-height:40px\">Type<\u002Fh2>\n    <p style=\"margin:0; font-size:16px; line-height:24px; color:#5A655E; max-width:640px\">One sans for everything. It must draw ọ́ correctly, have tabular figures and be free on Google Fonts. Page set in <b style=\"color:#0A0A0A\">{{ fontName }}<\u002Fb>; switch in Tweaks.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); gap:16px\">\n    <div style=\"border:1px solid #DCE2DD; border-radius:16px; padding:24px; display:grid; gap:16px; align-content:start; font-family:'Be Vietnam Pro',sans-serif\">\n      <div style=\"display:flex; justify-content:space-between; gap:8px\"><b style=\"font-size:14px\">Be Vietnam Pro<\u002Fb><span style=\"font-size:12px; font-weight:600; color:#0B7A4B; background:#E6F4EC; padding:4px 8px; border-radius:8px\">Recommended<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:72px; font-weight:700; letter-spacing:-0.02em; line-height:1.15\">Pamọ́<\u002Fdiv>\n      <div style=\"font-size:28px; font-weight:700; font-variant-numeric:tabular-nums\">3,300.75 USDC<\u002Fdiv>\n      <p style=\"margin:0; font-size:14px; line-height:20px; color:#5A655E\">Drawn for Vietnamese, so stacked marks and the dot below sit with care. Weak point: wide letters take more room at 390 px.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #DCE2DD; border-radius:16px; padding:24px; display:grid; gap:16px; align-content:start; font-family:'Hanken Grotesk',sans-serif\">\n      <b style=\"font-size:14px\">Hanken Grotesk<\u002Fb>\n      <div style=\"font-size:72px; font-weight:700; letter-spacing:-0.02em; line-height:1.15\">Pamọ́<\u002Fdiv>\n      <div style=\"font-size:28px; font-weight:700; font-variant-numeric:tabular-nums\">3,300.75 USDC<\u002Fdiv>\n      <p style=\"margin:0; font-size:14px; line-height:20px; color:#5A655E\">Compact, open and calm in body text. Weak point: very neutral; the wordmark relies on the tone marks for character.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #DCE2DD; border-radius:16px; padding:24px; display:grid; gap:16px; align-content:start; font-family:'IBM Plex Sans',sans-serif\">\n      <b style=\"font-size:14px\">IBM Plex Sans<\u002Fb>\n      <div style=\"font-size:72px; font-weight:700; letter-spacing:-0.02em; line-height:1.15\">Pamọ́<\u002Fdiv>\n      <div style=\"font-size:28px; font-weight:700; font-variant-numeric:tabular-nums\">3,300.75 USDC<\u002Fdiv>\n      <p style=\"margin:0; font-size:14px; line-height:20px; color:#5A655E\">Very clear figures. Weak point: a slightly technical, corporate tone for an everyday savings app.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0; font-size:14px; line-height:20px; color:#5A655E; max-width:760px\">All three ship a Vietnamese subset on Google Fonts containing ọ (U+1ECD) and the combining acute (U+0301), so nothing falls back.<\u002Fp>\n  <div style=\"display:grid\">\n    <sc-for list=\"{{ scale }}\" as=\"t\" hint-placeholder-count=\"9\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,180px) minmax(0,1fr); gap:24px; align-items:baseline; padding:18px 0; border-bottom:1px solid #DCE2DD\">\n        <div style=\"display:grid; gap:2px\"><b style=\"font-size:14px\">{{ t.name }}<\u002Fb><span style=\"font-size:13px; color:#5A655E\">{{ t.spec }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:{{ t.size }}; line-height:{{ t.lh }}; font-weight:{{ t.w }}; color:{{ t.color }}; font-variant-numeric:tabular-nums; min-width:0\">{{ t.sample }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"border-top:1px solid #DCE2DD; padding:64px 0; display:grid; gap:32px\">\n  <div style=\"display:grid; gap:8px\">\n    <div style=\"font-size:14px; font-weight:600; color:#5A655E\">05<\u002Fdiv>\n    <h2 style=\"margin:0; font-size:32px; line-height:40px\">Tiers<\u002Fh2>\n    <p style=\"margin:0; font-size:16px; line-height:24px; color:#5A655E; max-width:640px\">Not three colours. Each tier shows its name and a level mark: three bars, one to three filled in Pamo green, on a mint chip.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:48px; flex-wrap:wrap\">\n    <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n      <div style=\"display:grid; gap:12px; justify-items:start\">\n        <div style=\"display:inline-flex; align-items:center; gap:8px; background:#E6F4EC; padding:6px 10px; border-radius:8px\">\n          <span style=\"display:inline-flex; align-items:flex-end; gap:2px; height:12px\"><span style=\"width:3px; height:6px; border-radius:1px; background:{{ t.b1 }}\"><\u002Fspan><span style=\"width:3px; height:9px; border-radius:1px; background:{{ t.b2 }}\"><\u002Fspan><span style=\"width:3px; height:12px; border-radius:1px; background:{{ t.b3 }}\"><\u002Fspan><\u002Fspan>\n          <span style=\"font-size:13px; font-weight:600\">{{ t.name }}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:13px; color:#5A655E\">{{ t.apy }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"border-top:1px solid #DCE2DD; padding:64px 0; display:grid; gap:32px\">\n  <div style=\"display:grid; gap:8px\">\n    <div style=\"font-size:14px; font-weight:600; color:#5A655E\">06<\u002Fdiv>\n    <h2 style=\"margin:0; font-size:32px; line-height:40px\">Icons<\u002Fh2>\n    <p style=\"margin:0; font-size:16px; line-height:24px; color:#5A655E; max-width:640px\">Iconsax at 24 px, 1.5 px stroke, black. Linear (L) for default, Bold (B) for selected. Always with a text label. Slots below take the real SVGs at build.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px\">\n    <sc-for list=\"{{ icons }}\" as=\"i\" hint-placeholder-count=\"7\">\n      <div style=\"border:1px solid #DCE2DD; border-radius:12px; padding:16px 12px; display:grid; gap:10px; justify-items:center\">\n        <div style=\"display:flex; gap:10px\"><div style=\"width:28px; height:28px; border:1px dashed #8A948D; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#5A655E; font-family:ui-monospace,monospace\">L<\u002Fdiv><div style=\"width:28px; height:28px; background:#0A0A0A; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#FFFFFF; font-family:ui-monospace,monospace\">B<\u002Fdiv><\u002Fdiv>\n        <b style=\"font-size:13px\">{{ i.label }}<\u002Fb>\n        <span style=\"font-size:11px; color:#5A655E; font-family:ui-monospace,monospace\">{{ i.name }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"border-top:1px solid #DCE2DD; padding:64px 0 96px; display:grid; gap:32px\">\n  <div style=\"display:grid; gap:8px\">\n    <div style=\"font-size:14px; font-weight:600; color:#5A655E\">07<\u002Fdiv>\n    <h2 style=\"margin:0; font-size:32px; line-height:40px\">Voice<\u002Fh2>\n    <p style=\"margin:0; font-size:16px; line-height:24px; color:#5A655E; max-width:640px\">Plain words. Every amount shows its unit. Rates are live and labelled. Nothing is promised.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid\">\n    <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; padding-bottom:12px; border-bottom:1px solid #0A0A0A; font-size:13px; font-weight:600\"><span>We write<\u002Fspan><span style=\"color:#B3261E\">✕ We never write<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ voice }}\" as=\"v\" hint-placeholder-count=\"6\">\n      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; padding:20px 0; border-bottom:1px solid #DCE2DD; font-size:18px; line-height:26px\">\n        <span style=\"font-weight:600\">{{ v.yes }}<\u002Fspan>\n        <span style=\"color:#5A655E; text-decoration:line-through; text-decoration-color:#B3261E\">{{ v.no }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;typeface&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Be Vietnam Pro&quot;,&quot;Hanken Grotesk&quot;,&quot;IBM Plex Sans&quot;],&quot;default&quot;:&quot;Be Vietnam Pro&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Type&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const f = this.props.typeface ?? 'Be Vietnam Pro';\n    const ok = (bg, fg, sample, label, r) => ({ bg, fg, sample, label, ratio: '✓ ' + r, rc: '#0A0A0A', note: 'Pass' });\n    const bad = (bg, fg, sample, label, r, note) => ({ bg, fg, sample, label, ratio: '✕ ' + r, rc: '#B3261E', note });\n    const on = '#0B7A4B', off = '#DCE2DD';\n    return {\n      font: `'${f}', system-ui, sans-serif`, fontName: f,\n      helpers: [\n        { name: 'Bright green', hex: '#3DDC84', job: 'Green text and marks on black only' },\n        { name: 'Mint', hex: '#E6F4EC', job: 'Fills behind green text: chips, success, selected rows' },\n        { name: 'Green pressed', hex: '#096640', job: 'Hover and pressed green button' },\n        { name: 'Grey text', hex: '#5A655E', job: 'Secondary text and captions on white' },\n        { name: 'Grey text on black', hex: '#A3ADA6', job: 'Secondary text in dark sections' },\n        { name: 'Grey muted', hex: '#8A948D', job: 'Placeholder and disabled only' },\n        { name: 'Grey line', hex: '#DCE2DD', job: 'Borders, dividers, empty progress' },\n        { name: 'Grey surface', hex: '#F5F7F5', job: 'Page behind white cards' },\n      ],\n      pairs: [\n        ok('#FFFFFF', '#0A0A0A', '3,300.75 USDC', 'Black on white', '19.8'),\n        ok('#0B7A4B', '#FFFFFF', 'Start saving', 'White on Pamo green', '5.4'),\n        ok('#096640', '#FFFFFF', 'Start saving', 'White on green pressed', '7.0'),\n        ok('#FFFFFF', '#0B7A4B', '+12.48 USDC', 'Pamo green on white', '5.4'),\n        ok('#E6F4EC', '#0B7A4B', 'Earned', 'Pamo green on mint', '4.8'),\n        ok('#0A0A0A', '#3DDC84', 'Live on Arc', 'Bright green on black', '11.1'),\n        ok('#FFFFFF', '#5A655E', 'Unlocks Mar 1, 2027', 'Grey text on white', '6.1'),\n        ok('#0A0A0A', '#A3ADA6', 'Keep it safe.', 'Grey on black', '8.6'),\n        ok('#FCEBE9', '#B3261E', 'Failed', 'Error on its fill', '5.7'),\n        bad('#0A0A0A', '#0B7A4B', '+12.48 USDC', 'Pamo green on black', '3.7', 'Use bright green'),\n        bad('#FFFFFF', '#3DDC84', '+12.48 USDC', 'Bright green on white', '1.8', 'Never'),\n        bad('#FFFFFF', '#8A948D', '0.00', 'Grey muted on white', '3.1', 'Placeholder only'),\n      ],\n      scale: [\n        ['Balance', '48 / 56 · Bold', 48, 56, 700, '#0A0A0A', '3,300.75 USDC'],\n        ['Display', '40 / 48 · Bold', 40, 48, 700, '#0A0A0A', 'Keep it safe.'],\n        ['Heading 1', '32 / 40 · Bold', 32, 40, 700, '#0A0A0A', 'Your pots'],\n        ['Heading 2', '24 / 32 · Bold', 24, 32, 700, '#0A0A0A', 'Review your saving'],\n        ['Heading 3', '20 / 28 · Bold', 20, 28, 700, '#0A0A0A', 'Emergency fund'],\n        ['Body', '16 / 24 · Regular', 16, 24, 400, '#0A0A0A', 'Each pot’s money is lent out through a USDC lending vault, so it earns while it sits.'],\n        ['Label', '14 / 20 · Semibold', 14, 20, 600, '#0A0A0A', 'Start saving'],\n        ['Earned', '16 / 24 · Semibold', 16, 24, 600, '#0B7A4B', '+12.48 USDC earned'],\n        ['Caption', '12 / 16 · Regular', 12, 16, 400, '#5A655E', '4.48% APY today, changes daily'],\n      ].map(([name, spec, s, lh, w, color, sample]) => ({ name, spec, size: s + 'px', lh: lh + 'px', w, color, sample })),\n      tiers: [\n        { name: 'Calm', apy: '3.12% APY today', b1: on, b2: off, b3: off },\n        { name: 'Steady', apy: '4.48% APY today', b1: on, b2: on, b3: off },\n        { name: 'Bold', apy: '6.05% APY today', b1: on, b2: on, b3: on },\n      ],\n      icons: [['Home', 'home-2'], ['Pots', 'wallet-2'], ['New pot', 'add-circle'], ['Locked', 'lock'], ['Calculator', 'calculator'], ['Activity', 'clock'], ['Withdraw', 'export']].map(([label, name]) => ({ label, name })),\n      voice: [\n        ['4.48% APY today, changes daily', 'Earn 4.48% guaranteed'],\n        ['120.50 USDC', '$120.5'],\n        ['Allow Pamo to use your USDC', 'Approve token spend'],\n        ['Estimate at today’s rate. Not a promise.', 'You will earn 72 USDC this year'],\n        ['Steady earns in a USDC lending vault.', 'Invest in our Steady fund'],\n        ['Cancelled. Nothing was moved.', 'Error: user rejected request'],\n      ].map(([yes, no]) => ({ yes, no })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
